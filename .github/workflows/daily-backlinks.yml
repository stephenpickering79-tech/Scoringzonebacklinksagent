name: Daily Backlink Agent

on:
  # NOTE: the daily schedule is DISABLED — hosting moved to Railway, which now runs the
  # propose job on its own daily timer (see serve.py + DEPLOY_RAILWAY.md). Re-enable this
  # cron only if you move scheduling back to GitHub Actions. workflow_dispatch is kept as a
  # manual backup (Actions tab → Run workflow).
  # schedule:
  #   - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (propose = research+review only for human review; submit = execute approved submissions)'
        required: true
        default: 'propose'
        type: choice
        options:
          - propose
          - submit
      approved_targets:
        description: 'Comma-separated list of target names/IDs to submit (only used when mode=submit). Leave empty for propose.'
        required: false
        default: ''
        type: string

jobs:
  propose:
    # This job runs on schedule (propose only) or when manually triggered with mode=propose
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'propose')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Use custom GH_TOKEN (PAT with contents:write + issues:write) for full permissions.
          # Falls back to default GITHUB_TOKEN if GH_TOKEN not set (limited perms).
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || pip install steel-sdk python-dotenv requests

      - name: Run Backlink Agent in PROPOSE mode (research + review only)
        env:
          STEEL_API_KEY: ${{ secrets.STEEL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # For LLM scoring via OpenRouter (Grok, Claude, etc.)
          AGENT_MODE: "propose"
          DRY_RUN: "true"   # Safety: never submit on scheduled/propose runs
        run: |
          python3 backlink_agent/orchestrator.py

      - name: Generate dashboard JSON (docs/data)
        run: |
          python3 backlink_agent/dashboard.py

      - name: Create or update daily proposal Issue
        env:
          # Use custom GH_TOKEN for gh CLI (requires issues:write scope).
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          REPORT_FILE="data/daily_report_${DATE}.md"
          SUMMARY_FILE="data/summary_${DATE}.json"

          if [ ! -f "$REPORT_FILE" ]; then
            echo "No report file generated; skipping issue creation."
            exit 0
          fi

          # Only file an Issue when there's actually something to review.
          # Avoids spamming an empty Issue every day when research finds nothing.
          SHORTLIST_SIZE=$(python3 -c "import json,sys; print(json.load(open('$SUMMARY_FILE')).get('shortlist_size', 0))" 2>/dev/null || echo 0)
          if [ "$SHORTLIST_SIZE" -gt 0 ]; then
            gh issue create \
              --title "Backlink Proposals - ${DATE} (Human Review Required)" \
              --body-file "$REPORT_FILE" \
              --label "backlink-proposal" \
              || echo "Issue creation failed (non-fatal)"
          else
            echo "Shortlist is empty (${SHORTLIST_SIZE} targets); skipping Issue creation for ${DATE}."
          fi

      - name: Commit any generated data / logs / shortlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: daily backlink PROPOSE run [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          git push || echo "Push may have failed (non-fatal for propose run)"

  submit:
    # This job only runs on manual trigger with mode=submit
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'submit'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Use custom GH_TOKEN (PAT with contents:write + issues:write) for full permissions.
          # Falls back to default GITHUB_TOKEN if GH_TOKEN not set (limited perms).
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || pip install steel-sdk python-dotenv requests

      - name: Run Backlink Agent in SUBMIT mode (human-approved targets only)
        env:
          STEEL_API_KEY: ${{ secrets.STEEL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # Optional - for LLM-assisted submission text if desired
          AGENT_MODE: "submit"
          APPROVED_TARGETS: ${{ github.event.inputs.approved_targets }}
          DRY_RUN: "false"
        run: |
          python3 backlink_agent/orchestrator.py

      - name: Generate dashboard JSON (docs/data)
        run: |
          python3 backlink_agent/dashboard.py

      - name: Commit tracker / log updates after submissions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: backlink SUBMIT run for approved targets [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          git push || echo "Push may have failed (non-fatal)"
